name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release preparation
        run: python3 -B -m unittest discover -s tools/tests

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Compile android tests
        run: ./gradlew compileDebugAndroidTestKotlin

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Verify debug build receipts
        run: python3 tools/check-apk-receipts.py app/build/outputs/apk/debug/*.apk

      - name: Retain debug build receipts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-receipts
          path: app/build/outputs/apk/debug/*.receipt.json
          if-no-files-found: error